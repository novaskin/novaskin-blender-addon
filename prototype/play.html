<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NovaSkin animated wallpaper — player prototype</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #wrap { width: 960px; margin: 16px auto; }
  canvas { display: block; width: 960px; }
  #hud { width: 960px; margin: 8px auto; display: flex; gap: 16px; align-items: center; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas></div>
<div id="hud">
  <button id="playbtn">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" style="flex:1; min-width:200px;">
  <span id="time">0.0s</span>
</div>
<div id="hud">
  <label>export folder (manifest.json): <input type="file" id="dir" webkitdirectory multiple></label>
</div>
<div id="hud">
  <label><input type="checkbox" id="ck_bg" checked> background</label>
  <label><input type="checkbox" id="ck_pl" checked> players</label>
  <label><input type="checkbox" id="ck_li" checked> light</label>
  <label><input type="checkbox" id="ck_fg" checked> foreground</label>
  <span id="skins"></span>
  <span id="stats">loading…</span>
</div>
<script type="module" src="play.js"></script>
</body>
</html>
